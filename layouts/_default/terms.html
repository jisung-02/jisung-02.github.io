{{ define "main" }}
  <header class="page-head reveal">
    <p class="page-head__eyebrow">Tag Index</p>
    <h1>{{ .Title }}</h1>
    <p class="page-head__meta">태그별 문서를 빠르게 탐색할 수 있습니다.</p>
  </header>

  <section class="flow-stream flow-stream--list" aria-label="태그 목록">
    {{ range $index, $tagPage := .Pages.ByTitle }}
      {{ $drift := cond (eq (mod $index 2) 0) "0.015" "-0.012" }}
      <article class="flow-item reveal" data-drift data-drift-speed="{{ $drift }}">
        <p class="flow-item__meta">Tag</p>
        <h2><a href="{{ $tagPage.RelPermalink }}">#{{ $tagPage.LinkTitle }}</a></h2>
        <p>{{ len $tagPage.Pages }}개의 문서</p>
      </article>
    {{ end }}
  </section>
{{ end }}
