<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07121e">
  <title>잠 못 드는 밤 · Mosquito Night</title>
  <meta name="description" content="잠 못 드는 밤 — 모기를 잡고 도구와 자동 사냥 동료를 키우는 게임">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07121e;overflow:hidden;touch-action:none}
    #canvas{display:block;width:100%;height:100%;outline:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;gap:14px;background:#07121e;color:#ddd9cd;font:15px system-ui,sans-serif;text-align:center}
    #progress{width:min(260px,60vw);height:4px;border:0;accent-color:#8cb7a0}
    #notice{max-width:320px;padding:20px;line-height:1.6}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="잠 못 드는 밤 모기 잡기 게임"></canvas>
  <div id="loading"><span id="notice">불러오는 중</span><progress id="progress"></progress></div>
  <noscript>게임을 실행하려면 JavaScript를 켜 주세요.</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15621820,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const engine = new Engine(config);
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    const fail = error => {
      console.error(error);
      notice.textContent = '게임을 불러오지 못했습니다. 새로고침해 주세요.';
      progress.hidden = true;
    };
    if (Engine.getMissingFeatures({threads: false}).length) {
      notice.textContent = 'Chrome이나 Firefox에서 열어 주세요.';
      progress.hidden = true;
    } else {
      engine.startGame({onProgress(current,total) {
        if (total > 0) { progress.max = total; progress.value = current; }
      }}).then(() => { loading.remove(); document.getElementById('canvas').focus(); }, fail);
    }
  </script>
</body>
</html>
