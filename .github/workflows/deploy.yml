name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@92cdaf8c4a2654f205d3ed422bb0bab431c6d59e # v2.3.0
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Cache the game's minimal Web template
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mosquito-night-web-build/mosquito-web-release.zip
            ~/.cache/mosquito-night-web-build/template.json
          key: mosquito-web-${{ runner.os }}-${{ hashFiles('games/mosquito-night/tools/build_web_template.py', 'games/mosquito-night/tools/web_template.py') }}
      - name: Build Mosquito Night from its pinned submodule
        run: python3 games/mosquito-night/tools/export_web.py --output public/mosquito-night
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build Magic Conch from its pinned submodule
        run: |
          npm ci --prefix magic_conch
          npm test --prefix magic_conch
          npm run build --prefix magic_conch
          npm run prepare:laya-assets --prefix magic_conch
          mkdir -p public/magic_conch
          cp -R magic_conch/dist/. public/magic_conch/
      - uses: withastro/action@v6
        with:
          node-version: 24
      - name: Check published Pages size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path("dist").rglob("*") if p.is_file())
          print(f"Published site: {size:,} bytes")
          assert size < 1_000_000_000, "Pages exceeds the 1 GB published-site limit"
          PY
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
