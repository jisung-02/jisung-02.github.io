<!doctype html>
<html lang="ko">
  {{ partial "head.html" . }}
  <body class="site-body" data-section="{{ .Section }}" data-kind="{{ .Kind }}">
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <div class="site-frame">
        <div class="site-progress" aria-hidden="true"></div>
        {{ partial "header.html" (dict "Page" . "VaultNav" (index hugo.Data.generated "vault-navigation")) }}
        <main id="main-content" class="site-main">
          {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer.html" . }}
    </div>
    <script type="module" src="{{ "assets/app.js" | relURL }}"></script>
  </body>
</html>
