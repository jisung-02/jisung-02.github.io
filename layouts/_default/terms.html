{{ define "main" }}
  <header class="archive-intro reveal">
    <p class="archive-intro__kicker">Tag index</p>
    <h1>{{ .Title }}</h1>
    <p class="archive-intro__body">태그를 기준으로 문서를 빠르게 찾을 수 있습니다.</p>
  </header>

  <section class="archive-grid archive-grid--tags" aria-label="태그 목록">
    {{ range .Pages.ByTitle }}
      <article class="tag-card">
        <p class="tag-card__meta">Tag</p>
        <h2><a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a></h2>
        <p>{{ len .Pages }}개의 문서</p>
      </article>
    {{ end }}
  </section>
{{ end }}
