<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2038" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'"
  />
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="preload" href="{{ "assets/fonts/lake-display.ttf" | relURL }}" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="{{ "assets/fonts/lake-body.ttf" | relURL }}" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="{{ "assets/styles.css" | relURL }}" />
</head>
