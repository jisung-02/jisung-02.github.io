{{ define "main" }}
  <header class="archive-intro reveal">
    <p class="archive-intro__kicker">Tag</p>
    <h1>#{{ .Title }}</h1>
    <p class="archive-intro__body">관련 문서 {{ len .Pages }}개를 같은 흐름으로 모아봤습니다.</p>
  </header>

  <section class="archive-stream" aria-label="문서 목록">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "editorial-entry-card.html" . }}
    {{ end }}
  </section>
{{ end }}
