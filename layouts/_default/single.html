{{ define "main" }}
  <article class="article article--flow">
    <header class="page-head reveal">
      <p class="page-head__eyebrow">{{ .Section | humanize }}</p>
      <h1>{{ .Title }}</h1>
      <p class="page-head__meta">
        {{ if .Date }}{{ .Date.Format "2006-01-02" }} · {{ end }}{{ .ReadingTime }} min read · {{ .WordCount }} words
      </p>
      {{ with .Params.tags }}
        <p class="flow-item__tags">
          {{ range . }}
            <a href="{{ printf "tags/%s/" (. | urlize) | relURL }}">#{{ . }}</a>
          {{ end }}
        </p>
      {{ end }}
    </header>

    <section class="prose prose--flow reveal">
      {{ .Content }}
    </section>

    <nav class="article-nav reveal" aria-label="문서 이동">
      <a href="{{ printf "%s/" .Section | relURL }}">{{ .Section | humanize }} 목록</a>
      <a href="{{ site.Home.RelPermalink }}">홈으로</a>
    </nav>
  </article>
{{ end }}
